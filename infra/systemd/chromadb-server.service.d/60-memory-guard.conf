# 2026-10-16 memory-diet: the Rust `chroma run` server grows without bound
# (22k vectors / 135MB raw data, yet 250MB RAM + 3.3GB swap after 7.5 days).
# MemoryHigh=250M with an unlimited swap budget kept pushing it into swap
# instead of failing, so it slowly ate the host's whole swap.
# Measured after a restart: the first query loads the index, then usage
# plateaus around 510MB. MemoryHigh sits above that so steady state never
# swaps. Long-term growth is about 400MB/day, so the daily
# chromadb-restart.timer keeps the peak near 900MB. If the timer is missed
# and the leak reaches MemoryMax plus the swap cap, the OOM kill counts as a
# failure and Restart=on-failure brings chroma back.
[Service]
MemoryHigh=600M
MemoryMax=900M
MemorySwapMax=256M
