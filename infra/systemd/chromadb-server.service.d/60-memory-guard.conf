# 2026-10-16 memory-diet: the Rust `chroma run` server grows without bound
# (22k vectors / 135MB raw data, yet 250MB RAM + 3.3GB swap after 7.5 days).
# MemoryHigh=250M with an unlimited swap budget kept pushing it into swap
# instead of failing, so it slowly ate the host's whole swap.
# Now the RAM ceiling has headroom, swap is capped, and when the leak hits
# the cap the OOM kill counts as a failure: Restart=on-failure brings it back
# in about 5s. chromadb-restart.timer also restarts it at a quiet hour.
[Service]
MemoryHigh=400M
MemoryMax=600M
MemorySwapMax=256M
