# 2026-10-16 memory-diet: the Rust `chroma run` server grows without bound
# (22k vectors / 135MB raw data, yet 250MB RAM + 3.3GB swap after 7.5 days).
# The base unit's MemoryHigh=250M with an unlimited swap budget kept pushing
# it into swap instead of failing, so it slowly ate the host's whole swap.
#
# Measured after a restart: the first query loads the index, then usage
# plateaus around 510MB. Long-term growth is about 400MB/day, and
# chromadb-restart.timer restarts it daily at a quiet hour.
#
# MemoryHigh is deliberately unset (infinity). In cgroup v2, MemoryHigh
# throttles allocations rather than killing, so a leak sitting between
# MemoryHigh and MemoryMax would make Mem0 slow for hours instead of
# failing. With only MemoryMax plus a swap cap, the leak ends in a clean OOM
# kill once usage exceeds about 900M RAM + 256M swap. That counts as a
# failure, and Restart=on-failure brings chroma back in seconds.
[Service]
MemoryHigh=infinity
MemoryMax=900M
MemorySwapMax=256M
