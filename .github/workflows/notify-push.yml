name: notify-push

# master / dev への push を、ブランチ別の Discord チャンネルへ通知する。
# GitHub の native webhook は全ブランチが1 URL に来て振り分けられないため、
# Actions 側で GITHUB_REF を見て対応する webhook secret を選ぶ。
on:
  push:
    branches: [master, dev]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Notify branch-specific Discord channels
        env:
          # ブランチごとに複数サーバーへミラーする。webhook を増やすときは
          # secret を足して下の配列に追記するだけ (_2 = あしたぼ開発サーバー)。
          WEBHOOK_MASTER: ${{ secrets.DISCORD_WEBHOOK_MASTER }}
          WEBHOOK_MASTER_2: ${{ secrets.DISCORD_WEBHOOK_MASTER_2 }}
          WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          WEBHOOK_DEV_2: ${{ secrets.DISCORD_WEBHOOK_DEV_2 }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF##*/}"
          case "${BRANCH}" in
            master) WEBHOOKS=("${WEBHOOK_MASTER}" "${WEBHOOK_MASTER_2}"); COLOR=3066993 ;;   # 緑
            dev)    WEBHOOKS=("${WEBHOOK_DEV}" "${WEBHOOK_DEV_2}");       COLOR=15105570 ;;  # 橙
            *)      echo "unexpected branch ${BRANCH}"; exit 0 ;;
          esac
          # event JSON から embed を組む。commits は先頭10件、超過は要約1行。
          PAYLOAD="$(jq -c --argjson color "${COLOR}" '
            (.commits | length) as $total
            | {
                username: "GitHub",
                embeds: [{
                  author: { name: (.pusher.name // "unknown") },
                  title: (($total | tostring) + " commit(s) → "
                          + .repository.full_name + ":"
                          + (.ref | sub("refs/heads/"; ""))),
                  url: .compare,
                  color: $color,
                  timestamp: (.head_commit.timestamp // null),
                  description: (
                    ([ .commits[0:10][]
                       | "[`" + (.id[0:7]) + "`](" + .url + ") "
                         + ((.message | split("\n")[0])[0:100])
                         + " — " + .author.name ] | join("\n"))
                    + (if $total > 10
                       then "\n… and " + (($total - 10) | tostring) + " more"
                       else "" end)
                  )
                }]
              }' "${GITHUB_EVENT_PATH}")"
          rc=0
          for WEBHOOK in "${WEBHOOKS[@]}"; do
            [ -z "${WEBHOOK}" ] && continue   # 未設定 secret はスキップ
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' -d "${PAYLOAD}" "${WEBHOOK}")"
            echo "Discord webhook responded ${code}"
            [ "${code}" = "204" ] || rc=1
          done
          exit "${rc}"
