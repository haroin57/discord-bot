name: test

on:
  push:
    branches: [master, main, dev, "feature/**"]
  pull_request:
    branches: [master, main, dev]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DISCORD_TOKEN: dummy_test_token
  ADMIN_USER_IDS: "1234567890"
  ANTHROPIC_API_KEY: ci-dummy
  OPENAI_API_KEY: ci-dummy
  GOOGLE_AI_API_KEY: ci-dummy
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  collection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: Reject collection-time test pollution
        run: python scripts/check_test_isolation.py
      - name: Collect all tests and run contracts
        run: python scripts/run_test_lane.py collection-contract --workers auto

  unit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: Run isolated unit lane
        run: python scripts/run_test_lane.py unit-fast --workers auto

  characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: Run characterization lane
        run: python scripts/run_test_lane.py characterization --workers auto

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: Run integration lane
        run: python scripts/run_test_lane.py integration --workers auto

  offline-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: Run deterministic offline evaluations
        run: python scripts/run_test_lane.py offline-eval --workers auto

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
