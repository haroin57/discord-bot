name: test
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST nightly (legacy-inclusive full suite)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          # No `|| true`: silently skipping dev deps made red tests invisible
          # (backlog P2, fixed as part of P0.5-d).
          pip install -r requirements-dev.txt
      - name: pytest (full suite)
        env:
          DISCORD_TOKEN: dummy_test_token
          ADMIN_USER_IDS: "1234567890"
        run: |
          # Full suite replaced the old hand-maintained file list, which had
          # drifted (fable fallback tests were never in CI — backlog P0).
          # `legacy` + `integration` markers are excluded via pyproject addopts.
          pytest -q -n 2
      - name: Conflict-marker scan
        run: |
          if grep -rn "^<<<<<<<\|^>>>>>>>" --include='*.py' --include='*.md' .; then
            echo "Merge conflict markers found"
            exit 1
          fi

  # P0.5-d governance: legacy-marked tests still run nightly so the marker
  # can't silently rot into a false-green CI. Failures here mean either the
  # legacy test should be deleted (via review) or a regression slipped in.
  nightly-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock || pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: pytest (everything incl. legacy)
        env:
          DISCORD_TOKEN: dummy_test_token
          ADMIN_USER_IDS: "1234567890"
        run: pytest -q -n 2 -m "not integration"
