name: lint
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: 'scripts deploy'

  # P0-d (docs/2026-07-03-grand-refactor-plan.md): definite-bug tier only.
  # Rule selection lives in pyproject.toml — do not widen it here.
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-tests
      - name: ruff (F821/F811/E9 tier)
        run: ruff check .
      - name: mypy (scoped files from pyproject.toml)
        run: mypy
