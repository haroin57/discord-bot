name: lint
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'scripts deploy'

  # P0-d (docs/2026-07-03-grand-refactor-plan.md): definite-bug tier only.
  # Rule selection lives in pyproject.toml — do not widen it here.
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "ruff>=0.15,<0.16" "mypy>=2.1,<3.0"
      - name: ruff (F821/F811/E9 tier)
        run: ruff check .
      - name: mypy (scoped files from pyproject.toml)
        run: mypy
