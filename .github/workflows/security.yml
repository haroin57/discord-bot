name: security

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Optional candidate SHA supplied by the trusted release controller.
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Audit locked Python dependencies
        # No patched stable release exists within the supported major version
        # for these advisories. Keep each temporary exception explicit so any
        # newly discovered vulnerability still fails the job.
        run: >-
          python -m pip_audit -r requirements.lock --strict
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-2636
      - name: Bandit static scan
        run: bandit -r services/ utils/ bot.py web_api.py main_async.py mcp_mem0_server.py -ll
