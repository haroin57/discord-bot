name: security

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Optional candidate SHA supplied by the trusted release controller.
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Audit locked Python dependencies
        # Keep each exception explicit so a newly discovered vulnerability
        # still fails the job. Anything with an installable fix is taken into
        # requirements.lock instead of being listed here.
        # 2026-11-10 batch: aiohttp 3.14.4 (+ yarl 1.25.1, which it requires),
        # certifi, msgpack, mcp 1.30.0, pillow 13, filelock 4, oauthlib 4.0.1
        # and the opentelemetry set realigned on 1.45.1 / semconv 0.66b1.
        # oauthlib no longer needs an exception. What remains has no
        # installable fix at all:
        #   PYSEC-2026-311, PYSEC-2026-3813/3814/3815  chromadb 1.5.9 -> NO
        #     fixed release exists; chromadb is pinned by the Mem0 vector store.
        #   PYSEC-2026-2636  mem0ai 1.0.11 -> only 2.0.0b2, a pre-release.
        #   PYSEC-2026-3552/3553/3554  cryptography 48.0.1 -> 49/50 (two major
        #     bumps). It underpins TLS, OAuth and JWT paths, so the upgrade
        #     needs its own verification pass instead of riding a bugfix PR.
        run: >-
          python -m pip_audit -r requirements.lock --strict
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-2636
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
      - name: Bandit static scan
        # Fixed /tmp paths are an intentional deployment convention and are
        # separately constrained by attachment and render-store policies.
        run: >-
          bandit -r services/ utils/ bot.py web_api.py main_async.py
          mcp_mem0_server.py -ll --skip B108
