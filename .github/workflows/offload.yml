name: offload
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  archive-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/archive
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/archive/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run types && git diff --exit-code -- worker-configuration.d.ts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
