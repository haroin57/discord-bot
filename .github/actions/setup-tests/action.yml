name: Set up Python test environment
description: Install the locked runtime and Phase 4 test dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
    - name: Cache pip
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock', 'requirements-ci.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --no-deps pip==26.1.2
        python -m pip install --disable-pip-version-check \
          --requirement requirements.lock \
          --requirement requirements-ci.lock
        python -m pip check
