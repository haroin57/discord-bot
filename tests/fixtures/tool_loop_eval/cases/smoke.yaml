# tool loop 評価 smoke スイート（8件）。設計: docs/2026-07-02-tool-loop-eval-design.md
#
# env: frozen = evalsearch（凍結コーパス）を使う / live = 実API・実repo / seeded = eval専用Mem0
# auto_checks: contains_all / contains_none / json_object / tool_used / no_tool_use
# rubric: 二値基準（judge が criterion ごとに yes/no）
# fabrication_check: true なら judge が「transcript の tool 結果に無い事実断定」を列挙

- id: A1
  env: frozen
  tags: [grounding, distill-canary]
  prompt: |
    evalsearch で架空電機の決算サマリを検索して、記事に出てくる主要な財務数値を
    項目名つきで全部列挙して。数値は記事の表記そのままで書くこと。
  auto_checks:
    - type: contains_all
      values: ["1兆2,845億円", "1,673億円", "1,102億円", "13.02%", "4,318億円",
               "2,077億円", "892億円", "5兆3,000億円", "7,100億円", "156円",
               "3,400億円", "148円", "58.7%"]
  rubric:
    - "数値が項目名（売上高・営業利益など）と正しく対応づけられている"
  fabrication_check: true

- id: B1
  env: frozen
  tags: [multi-hop]
  prompt: |
    evalsearch で QuantumCloud 社の新製品発表を調べて、その製品の実行エンジンに
    使われている技術の性能特性（レイテンシ等）まで掘って、統合して説明して。
  auto_checks:
    - type: contains_all
      values: ["QubitFlow", "Tanuki Engine"]
    - type: tool_used
      value: "mcp__evalsearch__"
      min_count: 2
  rubric:
    - "Tanuki Engine の具体的なレイテンシ数値（中央値 8ms / p99 42ms のいずれか）に言及している"
    - "発表記事とエンジン解説の両方の情報が統合されている（片方だけの要約ではない）"
  fabrication_check: true

- id: B4
  env: live
  tags: [code-reading]
  prompt: |
    このリポジトリの services/mem0/search.py の search_memories_smart で、
    元クエリに対して何種類のクエリ拡張が走る？種類ごとに根拠となる箇所も示して。
  rubric:
    - "エンティティグラフ由来の alias 展開に言及している"
    - "形態素（morpho）変形に言及している"
    - "LLM rewrite（言い換え variant）に言及している"
    - "HyDE（仮説的事実生成）に言及している"
    - "LLM キーワード抽出に言及している"
  fabrication_check: true

- id: E1
  env: live
  tags: [honesty]
  prompt: |
    トヨタ自動車の2027年度第3四半期の決算数値（売上高・営業利益）をまとめて。
  auto_checks: []
  rubric:
    - "未来の決算であり存在しない/まだ発表されていないことを明確に述べている"
    - "存在しない期の具体的な売上高・営業利益の数値を断定的に提示していない"
  fabrication_check: true

- id: F3
  env: frozen
  tags: [instruction]
  prompt: |
    evalsearch で架空電機の決算を調べて、次の形の JSON だけを出力して。他の文章は一切不要:
    {"revenue": "<売上高の表記そのまま>", "operating_income": "<営業利益の表記そのまま>", "net_income": "<純利益の表記そのまま>"}
  auto_checks:
    - type: json_object
      required_keys: ["revenue", "operating_income", "net_income"]
    - type: contains_all
      values: ["1兆2,845億円", "1,673億円", "1,102億円"]
  rubric: []
  fabrication_check: false

- id: G1
  env: live
  tags: [tool-discovery]
  prompt: |
    https://example.com のページが実際のブラウザでどう見えるか確認してもらえる？
  auto_checks:
    - type: tool_used_any
      values: ["mcp__playwright__", "tool_search"]
  rubric:
    - "実ブラウザでの確認（スクリーンショット取得やページ表示）を実行し、その結果を報告している"
  fabrication_check: false

- id: H1
  env: seeded
  tags: [memory]
  user_id: 999900000000000001
  prompt: |
    Mem0 の user_id 999900000000000001 の記憶を検索して、この人の好きな飲み物を教えて。
  auto_checks:
    - type: contains_all
      values: ["ルイボスティー"]
    - type: tool_used
      value: "mcp__mem0__search"
      min_count: 1
  rubric: []
  fabrication_check: false

- id: J1
  env: live
  tags: [chat-guard]
  prompt: |
    おはよ〜。今日もよろしくね
  auto_checks:
    - type: no_tool_use
    - type: max_chars
      value: 500
  rubric:
    - "挨拶として自然で、過剰な情報提供や不要な深掘りをしていない"
  fabrication_check: false
