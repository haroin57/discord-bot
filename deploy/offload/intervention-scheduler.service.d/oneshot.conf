[Service]
WorkingDirectory=/var/lib/discord-bot-releases/prod/current/src
Environment=PYTHON_DOTENV_DISABLED=1
Environment=BOT_STATE_DIR=/home/ubuntu/discord-bot/.state
Type=oneshot
ExecStart=
ExecStart=/home/ubuntu/discord-bot/.venv/bin/python -m services.intervention_scheduler --once
Restart=no
TimeoutStartSec=180
TimeoutStopSec=15
KillMode=control-group
