[Service]
WorkingDirectory=/var/lib/discord-bot-releases/prod/current/src
Environment=PYTHON_DOTENV_DISABLED=1
Type=oneshot
ExecStart=
ExecStart=/var/lib/discord-bot-releases/prod/current/venv/bin/python -m services.intervention_scheduler --once
Restart=no
TimeoutStartSec=180
TimeoutStopSec=15
KillMode=control-group
